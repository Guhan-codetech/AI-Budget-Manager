services:
  # ----------------------------------------------------
  # 1. Flask Backend REST API (Web Service)
  # ----------------------------------------------------
  - type: web
    name: ai-budget-manager-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # ----------------------------------------------------
  # 2. React Frontend Governance Portal (Static Site)
  # ----------------------------------------------------
  - type: static
    name: ai-budget-manager-frontend
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ai-budget-manager-backend
          property: url
          postfix: /api
